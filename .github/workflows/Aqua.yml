name: Aqua
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Aqua.jl
        # MadNLP is loaded so the SparseDirectSolverMadNLPExt extension assigns the
        # exported SDSSolver/SDSSolverOptions globals: the undefined-exports check
        # then validates them for real instead of flagging the declared-only state.
        # persistent_tasks is gated off under KernelAbstractions >= 0.10 for the same
        # two upstream reasons as in test/test_aqua.jl: KA 0.10's CPU backend keeps
        # worker tasks alive at exit, and Aqua's fresh temporary project fails to
        # precompile pocl_standalone_jll ("Cannot load SLEEF_jll").
        run: julia --color=yes -e 'using Pkg; Pkg.add(["Aqua", "MadNLP", "KernelAbstractions"]); Pkg.develop(path="."); using Aqua, MadNLP, KernelAbstractions, SparseDirectSolver; Aqua.test_all(SparseDirectSolver, ambiguities=false, persistent_tasks=(pkgversion(KernelAbstractions) < v"0.10"))'
