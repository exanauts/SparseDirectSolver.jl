name: Run tests

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      eltypes:
        description: 'SDS_TEST_ELTYPES: comma-separated element types; empty runs all four'
        required: false
        default: 'Float32,Float64,ComplexF32,ComplexF64'
        type: string

# Element types under test (test/backends.jl, issue #91): every run tests all four (owner call,
# 2026-10-13; the empty string selects them) — a manual run can narrow via its input. Kernel
# compilation per element type sets the test time.
env:
  SDS_TEST_ELTYPES: ${{ inputs.eltypes }}   # empty: all four element types, every run (owner call, 2026-10-13)

jobs:
  # Runs on the self-hosted kkt machine (more cores than a GitHub runner for the parallel test workers). The
  # job id stays as it was: the check name "test-github-cpuonly (ubuntu-latest, min, x64)" is a required check
  # of the branch ruleset.
  #
  # Julia versions (issue #161): this job tests the compat minimum, setup-julia's 'min' (the latest patch of
  # the lowest minor allowed by `julia` in Project.toml's [compat], 1.13.x today); the GPU legs below, Aqua
  # and Documentation test the latest release ('1'). Both resolve to the same 1.13.x until 1.14 ships, so
  # the minimum costs no extra run.
  test-github-cpuonly:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SDS_TEST_GPU: '0'
      # ParallelTestRunner workers (test/runtests.jl): kkt has 192 threads and 2 TB, shared by its four runners
      PTR_NUM_JOBS: '32'
    runs-on: [self-hosted, linux, X64, kkt]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        julia-version: ['min']
        julia-arch: [x64]

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - name: Machine
        run: nproc && free -g
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      # the GPU jobs skip the CPU backend, so its coverage comes from here
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  test-gpu:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The CPU backend and the backend-independent Aqua checks run in the
      # CPU-only jobs; testing them again here doubled the GPU jobs' time.
      SDS_TEST_CPU: '0'
      SDS_TEST_SKIP: 'test_aqua'
      # ParallelTestRunner workers, each with its own CUDA context on the runner's GPU
      PTR_NUM_JOBS: '12'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        julia-version: ['1']
        julia-arch: [x64]
        # Every leg must pass: the AMDGPU extension (T23) runs the suite on
        # ROCBackend with rocBLAS/rocSOLVER; test/backends.jl adds each backend
        # when its package is functional. The oneAPI extension (T31) is tested on
        # Aurora through ALCF GitLab CI (.gitlab-ci.yml, alcf.yml, alcf-report.yml),
        # which replaced the `oneapi` leg on the runner `headroom`. Making a check
        # required is a branch ruleset setting of the owner.
        backend: ['cuda', 'amdgpu']
    runs-on: [self-hosted, linux, X64, gpu, '${{ matrix.backend }}']

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - name: Machine
        run: nproc && free -g && (nvidia-smi -L || true)
      - name: Add CUDA.jl to the test environment
        if: matrix.backend == 'cuda'
        run: |
          julia --project=test -e 'using Pkg; Pkg.add("CUDA")'
      - name: Add AMDGPU.jl to the test environment
        if: matrix.backend == 'amdgpu'
        run: |
          julia --project=test -e 'using Pkg; Pkg.add("AMDGPU")'
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
