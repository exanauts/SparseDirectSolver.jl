name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Documenter pushes to gh-pages: `dev` from main, `stable`/`vX.Y.Z` from tags,
# `previews/PR<n>` from pull requests of this repository.
permissions:
  contents: write
  statuses: write

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not watched by claude-pipeline.yml and not a required check: a red docs
  # build does not hold a task PR. The examples run on CUDA, hence the GPU runner.
  docs:
    name: Build documentation
    runs-on: [self-hosted, linux, X64, gpu, cuda]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate the docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
